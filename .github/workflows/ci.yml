name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
      - run: flutter pub get
      - run: dart format --line-length 120 --output=none --set-exit-if-changed $(find lib test -name '*.dart' -not -path '*/generated/*')
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrations, RLS and concurrency tests
        run: scripts/db_test.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - working-directory: supabase/functions
        run: deno check delete-account/index.ts send-push/index.ts && deno lint && deno fmt --check && deno test send-push/

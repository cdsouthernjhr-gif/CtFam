<!doctype html>
<html lang="ms">
  <body style="margin:0;padding:24px;background:#f7f8fa;font-family:Arial,Helvetica,sans-serif;color:#1b2a4a;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;">
      <tr><td style="background:#1b2a4a;border-radius:16px 16px 0 0;padding:20px 24px;">
        <span style="color:#ffffff;font-size:20px;font-weight:bold;">FamilySync</span>
      </td></tr>
      <tr><td style="padding:24px;">
        <h2 style="margin:0 0 12px;font-size:20px;">Sahkan e-mel anda</h2>
        <p style="margin:0 0 20px;line-height:1.5;">Terima kasih kerana mendaftar FamilySync. Gunakan kod di bawah untuk mengesahkan akaun anda:</p>
        <p style="margin:0 0 20px;text-align:center;">
          <span style="display:inline-block;padding:14px 24px;background:#eaf6f0;border-radius:12px;font-size:32px;font-weight:bold;letter-spacing:8px;color:#1b2a4a;">{{ .Token }}</span>
        </p>
        <p style="margin:0 0 8px;line-height:1.5;">Buka aplikasi FamilySync dan masukkan kod ini. Kod ini akan tamat tempoh tidak lama lagi.</p>
        <p style="margin:0;line-height:1.5;color:#8a94a6;font-size:13px;">Jika anda tidak mendaftar akaun FamilySync, abaikan e-mel ini.</p>
      </td></tr>
    </table>
  </body>
</html>
